[package]
name = "langchainx-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Tool traits and implementations for langchainx"

[dependencies]
langchainx-core = { path = "../langchainx-core" }
async-trait     = "0.1.80"
thiserror       = "2.0.0"
serde           = { version = "1.0", features = ["derive"] }
serde_json      = "1.0"
log             = "0.4.21"
reqwest         = { version = "0.12", features = ["json"] }
scraper         = "0.27"
regex           = "1.10.4"
glob            = "0.3"
url             = "2.5.0"
urlencoding     = "2.1.3"
async-openai    = "0.28.1"
tokio           = { version = "1", features = ["process", "time"] }
which           = "7"
serde_yaml      = { version = "0.9", optional = true }
yaml-rust2      = { version = "0.10", optional = true }
secrecy         = { version = "0.10.3", features = ["serde"], optional = true }
http            = { version = "1", optional = true }
bytes           = { version = "1", optional = true }
futures-core    = { version = "0.3", optional = true }
# Security floor for RUSTSEC-2026-0258 in reqwest's HTTP/2 dependency graph.
h2              = { version = ">=0.4.16, <0.5", optional = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["fs", "process", "signal"], optional = true }

sqlx = { version = "0.8.0", default-features = false, features = [
    "postgres",
    "sqlite",
    "runtime-tokio-native-tls",
    "json",
    "uuid",
], optional = true }

[dev-dependencies]
tokio    = { version = "1", features = ["full"] }
mockito  = "1.4.0"
tempfile = "3"
langchainx-testsuite = { path = "../langchainx-testsuite" }
proptest = "1"

[features]
default    = []
fuzzing    = []
postgres   = ["dep:sqlx"]
sqlite-vss = ["dep:sqlx"]
sqlite-vec = ["dep:sqlx"]
bash-tool  = []
nu-tool    = []
openapi-toolkit = [
    "dep:serde_yaml",
    "dep:yaml-rust2",
    "dep:secrecy",
    "dep:http",
    "dep:bytes",
    "dep:futures-core",
    "dep:h2",
    "reqwest/stream",
    "reqwest/gzip",
    "reqwest/brotli",
    "reqwest/deflate",
    "reqwest/zstd",
    "tokio/net",
]
mcp-toolkit = [
    "dep:secrecy",
    "dep:nix",
    "tokio/io-util",
    "tokio/macros",
    "tokio/process",
    "tokio/rt",
    "tokio/sync",
    "tokio/time",
]
plugin-toolkits = ["openapi-toolkit", "mcp-toolkit"]
